name: Cars Dealership CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Lint & Test Django ────────────────────────────────────────
  django-lint:
    name: Django Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 server/djangoapp/ server/djangoproj/ --max-line-length=120 --exclude=migrations
        continue-on-error: true

      - name: Run Django system check
        working-directory: server
        run: |
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: djangoproj.settings

      - name: Run Django migrations (dry-run)
        working-directory: server
        run: |
          python manage.py migrate --run-syncdb
        env:
          DJANGO_SETTINGS_MODULE: djangoproj.settings

  # ── Node.js microservice ──────────────────────────────────────
  node-lint:
    name: Node.js Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/database/package.json

      - name: Install Node dependencies
        working-directory: server/database
        run: npm install

      - name: Check Node syntax
        working-directory: server/database
        run: node --check app.js

  # ── React frontend ────────────────────────────────────────────
  react-build:
    name: React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/frontend/package.json

      - name: Install React dependencies
        working-directory: server/frontend
        run: npm install

      - name: Build React app
        working-directory: server/frontend
        run: npm run build
        env:
          CI: false

  # ── Flask sentiment analyzer ──────────────────────────────────
  flask-lint:
    name: Flask Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Flask dependencies
        run: |
          pip install -r server/sentiment_analyzer/requirements.txt
          pip install flake8

      - name: Lint Flask app
        run: flake8 server/sentiment_analyzer/app.py --max-line-length=120
        continue-on-error: true

      - name: Test sentiment endpoint (import check)
        run: python -c "import sys; sys.path.insert(0, 'server/sentiment_analyzer'); from app import analyze_sentiment; print(analyze_sentiment('Fantastic services'))"

  # ── Docker Build ──────────────────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [django-lint, node-lint, flask-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django image
        run: docker build -t cars-dealership-django ./server

      - name: Build Node image
        run: docker build -t cars-dealership-node ./server/database

      - name: Build Flask image
        run: docker build -t cars-dealership-flask ./server/sentiment_analyzer

      - name: Verify images
        run: docker images | grep cars-dealership
